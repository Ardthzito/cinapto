<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINAPTO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
  background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),url("img/fondogalaxy.webp");
  background-size: cover;        /* Hace que cubra toda la pantalla */
  background-repeat: no-repeat;  /* Evita que se repita */
  background-position: center;   /* Centra la imagen */
  background-attachment: fixed;  /* 🔥 Esto la deja estática */
}
    .carousel-track {
      display: flex;
      gap: 16px;
      transition: transform 0.35s ease;
    }
    .carousel-viewport {
      overflow: hidden;
      flex: 1;
    }
    .poster {
      min-width: 160px;
      flex-shrink: 0;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .poster:hover {
      transform: scale(1.04);
    }
    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.25); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .carousel-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .dot.active { background: #fff; }
    
    .img-uniforme{
    width: 300px;
    height:auto;
    border-radius: 8px;
    
}



  </style>
</head>

<body class="bg-black text-white">

  <!-- HEADER -->
  <header class="container py-4">
    <img src="img/Cinapto.png" alt="Logo CINAPTO" class="logo img-fluid ">
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">

    <div class="row align-items-center">
      <!-- TEXTO -->
      <div class="col-12 col-md-6 mb-4">
        <h1 class="fw-bold">
          Bienvenido a una experiencia <br>
          de cine accesible
        </h1>
      </div>

      <div class="row align-items-center">
      <!-- TEXTO -->
      <div class="col-12 col-md-6 mb-4">
        <h2 class="fw-bold">
           <br>
      
        </h2>
      </div>

      <!-- FIGURA -->
      <div class="col-12 col-md-6 d-flex justify-content-center">
        <div class="figura">
          <div class="triangulo"></div>
          <div class="linea-vertical"></div>
          <div class="circulo c1"></div>
          <div class="circulo c2"></div>
        </div>
      </div>
    </div>

    <!-- CARRUSEL DE POSTERS -->
    <div class="row mt-5 mb-5">
      <div class="col-12">
        <div class="d-flex align-items-center gap-3">

          <button class="nav-btn" id="prev" aria-label="previo" disabled>&#8592;</button>

          <div class="carousel-viewport mb-5" id="carousel-viewport">
            <div class="carousel-track" id="carousel-track">

              <a href="martysupreme/martysupreme.html" class="mx-3">
                <img src="img/poster.jpg" alt="Ver información de la película Marty Supreme" class="img-fluid img-uniforme poster">
              </a>

              <a href="arco/arco.html" class="mx-3">
                <img src="arco/arco.html" alt="Ver información de la película Arco" class="img-fluid poster img-uniforme">
              </a>

              <!-- Agrega más posters aquí siguiendo el mismo patrón -->

               <a href="amelie/amelie.html" class="mx-3" >
                <img src="Amelie/img/posteramelie.jpg" alt="Ver información de la película Amelie" class="img-fluid img-uniforme poster">
              </a>

              <a href="amelie/amelie.html" class="mx-3"> 
                <img src="img/Thedrama.webp" alt="Ver información de la película El drama" class="img-fluid img-uniforme poster">
              </a>

              <a href="amelie/amelie.html" class="mx-3" >
                <img src="img/Hoppers.webp" alt="Ver información de la película El drama" class="img-fluid img-uniforme poster">
              </a>
            </div>
          </div>

          <button class="nav-btn" id="next" aria-label="siguiente">&#8594;</button>

        </div>

        <div class="carousel-dots" id="dots"></div>
      </div>
    </div>

  </main>

  <script>
    const track = document.getElementById('carousel-track');
    const viewport = document.getElementById('carousel-viewport');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const dotsEl = document.getElementById('dots');
    const cards = Array.from(track.children);
    let current = 0;

    function getVisible() {
      const w = viewport.offsetWidth;
      if (w < 400) return 1;
      if (w < 700) return 2;
      return 3;
    }

    function buildDots() {
      dotsEl.innerHTML = '';
      const pages = Math.ceil(cards.length / getVisible());
      for (let i = 0; i < pages; i++) {
        const btn = document.createElement('button');
        btn.className = 'dot' + (i === 0 ? ' active' : '');
        btn.onclick = () => goTo(i * getVisible());
        dotsEl.appendChild(btn);
      }
    }

    function goTo(index) {
      const visible = getVisible();
      const max = Math.max(0, cards.length - visible);
      current = Math.max(0, Math.min(index, max));
      const cardW = cards[0].offsetWidth + 16;
      track.style.transform = `translateX(-${current * cardW}px)`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current >= max;
      const page = Math.floor(current / visible);
      dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === page));
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    buildDots();
    goTo(0);

    window.addEventListener('resize', () => { buildDots(); goTo(0); });
  </script>

</body>
</html>
